<!doctype html>
<html lang="{{page.lang}}" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page.title}}</title>
  <meta name="description" content="{{page.description}}">
  {{page.head_links}}
  <meta property="og:type" content="{{page.og_type}}">
  <meta property="og:site_name" content="TalentRadar">
  <meta property="og:url" content="{{page.og_url}}">
  <meta property="og:title" content="{{page.og_title}}">
  <meta property="og:description" content="{{page.og_description}}">
  <meta property="og:image" content="{{config.origin}}/img/og-banner.jpg">
  <meta property="og:image:alt" content="{{page.og_image_alt}}">
  <meta property="og:locale" content="{{page.og_locale}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{config.origin}}/img/og-banner.jpg">
  <meta name="theme-color" content="#131B2C">
  <script>document.documentElement.className = "js";</script>
  {{page.preloads}}
  <link rel="stylesheet" href="{{asset:css/site.css}}">
  <script type="module" src="{{asset:js/site.js}}"></script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  {{page.jsonld}}
</head>
<body class="{{page.body_class}}">
<a class="skip-link" href="#main">{{t.nav_skip}}</a>
{{> header}}
<main id="main">
{{page.content}}
</main>
{{> footer}}
<!--sprite-->
<script type="application/json" id="i18n">{{page.i18n_json}}</script>
</body>
</html>
