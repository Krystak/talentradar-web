<!doctype html>
<html lang="{{page.lang}}" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page.title}}</title>
  <meta name="description" content="{{page.description}}">
  {{page.head_links}}
  <meta property="og:type" content="{{page.og_type}}">
  <meta property="og:site_name" content="TalentRadar">
  <meta property="og:url" content="{{page.og_url}}">
  <meta property="og:title" content="{{page.og_title}}">
  <meta property="og:description" content="{{page.og_description}}">
  <meta property="og:image" content="{{config.origin}}/img/og-{{page.lang}}.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{page.og_image_alt}}">
  <meta property="og:locale" content="{{page.og_locale}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{config.origin}}/img/og-{{page.lang}}.jpg">
  <meta name="twitter:image:alt" content="{{page.og_image_alt}}">
  <meta name="theme-color" content="#131B2C">
  <script>document.documentElement.className = "js";</script>
  {{page.preloads}}
  <script>
    /* Cloudflare Web Analytics, inserted here instead of by Cloudflare so the owner's browsers can be left out:
       ?nemerit=1 sets the cookie tr_owner on this browser (not counted from then on), ?merit=1 removes it. */
    (function () {
      var d = document, q = location.search, owner = "tr_owner=1";
      var flag = /[?&](ne)?merit=1(&|$)/.exec(q);
      if (flag) {
        d.cookie = flag[1] ? owner + "; max-age=315360000; path=/; secure; samesite=lax" : "tr_owner=; max-age=0; path=/";
        history.replaceState(null, "", location.pathname + location.hash);
        setTimeout(function () { alert(flag[1] ? "Tento prohlížeč se do návštěvnosti webu nepočítá." : "Tento prohlížeč se do návštěvnosti webu zase počítá."); }, 300);
      }
      if ((" " + d.cookie).indexOf(" " + owner) !== -1) return;
      var s = d.createElement("script");
      s.defer = true;
      s.src = "https://static.cloudflareinsights.com/beacon.min.js";
      s.setAttribute("data-cf-beacon", '{"token": "{{config.webAnalyticsToken}}"}');
      d.head.appendChild(s);
    })();
  </script>
  <link rel="stylesheet" href="{{asset:css/site.css}}">
  <script type="module" src="{{asset:js/site.js}}"></script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  {{page.jsonld}}
</head>
<body class="{{page.body_class}}">
<a class="skip-link" href="#main">{{t.nav_skip}}</a>
{{> header}}
<main id="main">
{{page.content}}
</main>
{{> footer}}
<!--sprite-->
<script type="application/json" id="i18n">{{page.i18n_json}}</script>
</body>
</html>
