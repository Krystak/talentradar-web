<!-- Phone only: both actions within thumb's reach. site.js shows it only while no other main button,
     the trial form, the footer or the open menu is on screen (one main button per screen, lead etapa 4a). -->
<div class="action-bar m-only" data-action-bar role="group" aria-label="{{t.bar_aria}}" inert>
  <a class="btn btn-primary" href="{{url:home}}#{{t.id_trial}}">{{t.bar_cta_primary}}</a>
  <a class="btn btn-secondary" href="{{call:href}}">{{t.bar_cta_call}}</a>
</div>
