<header class="site-header" data-header>
  <div class="container site-header__inner">
    <a class="logo" href="{{url:home}}">
      <img src="/falcon.svg" alt="" aria-hidden="true" width="32" height="32">
      <span class="logo__word" data-brand>TalentRadar</span>
    </a>
    <!-- the menu button comes before the menu, so Tab goes from it into the open menu (CSS puts it on the right) -->
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="{{t.nav_menu_open}}" hidden>{{icon:menu}}</button>
    <nav class="site-nav" id="site-nav" aria-label="{{t.nav_label}}">
      <ul>
        <li><a href="{{url:home}}#{{t.id_how}}">{{t.nav_how}}</a></li>
        <li class="d-only"><a href="{{url:home}}#{{t.id_data}}">{{t.nav_data}}</a></li>
        <li class="m-only"><a href="{{url:home}}#{{t.id_proof}}">{{t.nav_data}}</a></li>
        <li><a href="{{url:pricing}}">{{t.nav_pricing}}</a></li>
        <li><a href="{{url:blog}}">{{t.nav_blog}}</a></li>
        <li class="nav-mobile-only"><a href="{{url:demo}}">{{t.nav_tour}}</a></li>
      </ul>
      <div class="site-nav__aside">
        <a class="lang-switch" href="{{page.alt_url}}" hreflang="{{page.other_lang}}" lang="{{page.other_lang}}" aria-label="{{t.nav_lang_aria}}">{{t.nav_lang}}</a>
        <a class="site-nav__signin" href="{{config.appUrl}}">{{t.nav_signin}}</a>
      </div>
      <div class="site-nav__cta m-only">
        <a class="btn btn-primary" href="{{url:home}}#{{t.id_trial}}">{{t.hero_cta_primary}}</a>
        <a class="btn btn-secondary" href="{{call:href}}">{{t.hero_cta_secondary}}</a>
      </div>
    </nav>
    <a class="btn btn-primary btn--nav" href="{{url:home}}#{{t.id_trial}}">{{t.nav_cta}}</a>
  </div>
</header>
