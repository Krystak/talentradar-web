# Cloudflare Worker / Pages Configuration for TalentRadar
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "talentradar-web"
main = "worker.js"
compatibility_date = "2026-09-15"

# Static assets (HTML, images, data) served straight from the repo root.
[assets]
directory = "."
binding = "ASSETS"

# Lead storage for the /api/demo trial form.
# Keys written by worker.js:
#   lead:<uuid>      - the submission itself (name, e-mail, agency, companies)
#   leadfile:<uuid>  - the uploaded CSV/Excel, base64, kept for 90 days
#   rate_limit:<ip>  - submission counter, 1 hour TTL
[[kv_namespaces]]
binding = "TALENT_RADAR_KV"
id = "b33b5939becc4f21a8d9d824fae467b1"

# Secrets - set via CLI, never committed:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
#   npx wrangler secret put SLACK_WEBHOOK_URL
#   npx wrangler secret put RESEND_API_KEY      (needs a verified sender domain)
#   npx wrangler secret put RESEND_FROM         (e.g. TalentRadar <leads@talentradar.eu>)
#   npx wrangler secret put LEAD_INBOX          (where trial sign-ups are delivered)
#
# At least one notification channel must be configured, otherwise /api/demo
# refuses the submission and tells the visitor to e-mail directly instead of
# silently swallowing the lead.

# Production domain is talentradar.eu, wired up in the Cloudflare dashboard.
