# Cloudflare Worker / Pages Configuration for TalentRadar
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "talentradar-web"
main = "worker.js"
compatibility_date = "2026-09-15"

# Static assets: public/ only, built by `node build.mjs` from src/ (output committed).
# An address without a file reaches the Worker: an old address gets its 301,
# anything else the 404 page of its language (worker.js). No not_found_handling
# here on purpose: with "404-page" the assets answer 404 themselves and the old
# addresses never reach the Worker (seen on wrangler dev, 31. 10. 2026).
# The Worker also runs first for /video/* (byte ranges, serveVideo in
# worker-lib.js) and for old addresses that are still files, so they answer
# 301 instead of the assets' 307.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/video/*", "/index.html", "/gdpr.html", "/blog/index.html"]

# Lead storage for the /api/demo trial form.
# Keys written by worker.js:
#   lead:<uuid>      - the submission itself (name, e-mail, agency, companies)
#   leadfile:<uuid>  - the uploaded CSV/Excel, base64, kept for 90 days
#   rate_limit:<ip>  - submission counter, 1 hour TTL
[[kv_namespaces]]
binding = "TALENT_RADAR_KV"
id = "b33b5939becc4f21a8d9d824fae467b1"

# Secrets - set in the Cloudflare dashboard (Settings > Variables and Secrets)
# or via CLI. Node is not installed on the dev machine, so the dashboard is
# usually the quicker route:
#   SLACK_WEBHOOK_URL   incoming webhook, posts each sign-up to Slack
#   BREVO_API_KEY       transactional e-mail with the uploaded file attached
#   LEAD_FROM           sender address, e.g. leads@talentradar.eu
#   LEAD_INBOX          where sign-ups are delivered, e.g. krystof@talentradar.eu
#   TELEGRAM_BOT_TOKEN  optional, together with TELEGRAM_CHAT_ID
#   TELEGRAM_CHAT_ID
#
# talentradar.eu is already authenticated with Brevo - the brevo-code TXT,
# spf.brevo.com in SPF, DKIM on brevo1/brevo2._domainkey and a DMARC record
# all live in this account's Cloudflare DNS. No further DNS work is needed.
#
# At least one notification channel should be configured. Without one the lead
# is still written to KV, but nobody is told about it, so worker.js logs an
# error on every submission until a channel exists.

# Local run: `npm run dev` (wrangler dev --local, port 8830, KV in .wrangler/state).
# It sets OFFLINE_DEV=1, and a request to localhost is offline anyway: the Worker
# then sends nothing out (no e-mail, Slack, Telegram, DNS check or app wake-up).

# Production domain is talentradar.eu, wired up in the Cloudflare dashboard.
